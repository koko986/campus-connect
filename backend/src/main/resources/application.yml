spring:
  application:
    name: takka-api
  messages:
    basename: messages
    encoding: UTF-8
    # An unsupported locale must fall back to the English bundle, never to the server's own locale.
    fallback-to-system-locale: false
server:
  address: 0.0.0.0
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
takka:
  frontend-origin: ${TAKKA_FRONTEND_ORIGIN:http://localhost:5173}
  frontend-upstream: ${TAKKA_FRONTEND_UPSTREAM:https://campus-connect-ako890.vercel.app}
  supabase:
    url: ${SUPABASE_URL:https://rgotqcryuogqrdzlfntb.supabase.co}
    # Publishable keys are safe in public clients; the privileged secret remains environment-only.
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:sb_publishable_yY153JVd0BKy8_xMfVc9lw_eFtzsXJT}
    secret-key: ${SUPABASE_SECRET_KEY:}
