#
# Console text, English. This file is the reference: messages_my.properties must define exactly the
# same keys, which ConsoleMessageBundleTest checks on every build.
#
# Messages that take arguments are formatted by MessageFormat, so a literal apostrophe in one of them
# has to be doubled. The English wording avoids apostrophes for that reason.
#

