<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{admin/fragments :: head('Sign in')}"></head>
  <body class="console-body console-body--centered">
    <main class="console-login">
      <div class="console-brand console-brand--stacked">
        <span class="console-brand-mark">TK</span>
        <span class="console-brand-text">
          <strong>TAKKA</strong>
          <small>Administration</small>
        </span>
      </div>

      <h1>Administrator sign in</h1>
      <p class="console-login-note">
        This console is separate from the TAKKA member app. Only accounts listed as administrators can
        sign in here.
      </p>

      <p th:if="${signInError}" class="console-banner console-banner--error" th:text="${signInError}"></p>
      <p th:if="${param.signedOut}" class="console-banner console-banner--success">You have signed out.</p>

      <form th:action="@{/admin/login}" th:object="${form}" method="post" class="console-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label>
          <span>Email</span>
          <input type="email" th:field="*{email}" autocomplete="username" required autofocus />
        </label>
        <label>
          <span>Password</span>
          <!-- Bound by name only, so a rejected attempt never echoes the password back. -->
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="console-button console-button--primary">Sign in</button>
      </form>
    </main>
  </body>
</html>
