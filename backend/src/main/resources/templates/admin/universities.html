<!doctype html>
<html th:lang="${language.tag()}" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{admin/fragments :: head('console.title.universities')}"></head>
  <body class="console-body">
    <aside th:replace="~{admin/fragments :: sidebar}"></aside>
    <main class="console-main">
      <header th:replace="~{admin/fragments :: topbar}"></header>
      <div th:replace="~{admin/fragments :: flash}"></div>

      <div class="console-panel-head">
        <p class="console-scope-note" th:text="#{page.universities.note}">
          Published universities are visible to students. Unpublished and archived records stay hidden.
        </p>
        <div class="console-inline-actions">
          <a
            th:href="@{/admin/university-photos}"
            class="console-button console-button--ghost"
            th:text="#{action.reviewUniversityPhotos}"
            >Review campus photos</a
          >
          <a
            th:if="${superAdmin}"
            th:href="@{/admin/universities/new}"
            class="console-button console-button--primary"
            th:text="#{action.addUniversity}"
            >Add university</a
          >
        </div>
      </div>

      <p th:if="${universities.isEmpty()}" class="console-empty" th:text="#{page.universities.empty}">
        The directory is empty.
      </p>

      <table th:unless="${universities.isEmpty()}" class="console-table console-table--roomy">
        <thead>
          <tr>
            <th th:text="#{column.university}">University</th>
            <th th:text="#{column.location}">Location</th>
            <th th:text="#{column.catalog}">Catalog</th>
            <th th:text="#{column.state}">State</th>
            <th th:text="#{column.actions}">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="university : ${universities.items()}">
            <td>
              <span class="console-strong" th:text="${university.name()}">Name</span>
              <span class="console-muted" th:text="${university.shortName()} + ' · ' + ${university.slug()}"
                >short</span
              >
            </td>
            <td>
              <span th:text="${university.location()}">City</span>
              <span class="console-muted" th:text="${university.universityType()}">public</span>
            </td>
            <td>
              <span
                class="console-muted"
                th:text="#{page.universities.counts(${university.campuses()}, ${university.departments()}, ${university.programs()})}"
                >counts</span
              >
            </td>
            <td>
              <span
                class="console-pill"
                th:classappend="'console-pill--' + ${university.stateTone()}"
                th:text="${#messages.msg(university.stateKey())}"
                >Draft</span
              >
              <span class="console-muted" th:text="#{page.universities.updated(${university.updated()})}"
                >updated</span
              >
            </td>
            <td class="console-actions">
              <span th:unless="${superAdmin}" class="console-muted" th:text="#{page.universities.readOnly}"
                >Read only for moderators</span
              >

              <a
                th:if="${superAdmin}"
                th:href="@{'/admin/universities/' + ${university.id()} + '/edit'}"
                class="console-button console-button--ghost"
                th:text="#{action.edit}"
                >Edit</a
              >
              <a
                th:if="${superAdmin}"
                th:href="@{/admin/catalog(universityId=${university.id()})}"
                class="console-button console-button--ghost"
                th:text="#{console.nav.catalog}"
                >Catalog</a
              >

              <details th:each="change : ${stateChanges}" th:if="${superAdmin}" class="console-action">
                <summary
                  class="console-button"
                  th:classappend="${change.name() == 'ARCHIVE'} ? 'console-button--danger' : 'console-button--ghost'"
                  th:text="${#messages.msg(change.labelKey())}"
                  >Publish</summary
                >
                <form
                  th:action="@{'/admin/universities/' + ${university.id()} + '/state/' + ${change.slug()}}"
                  method="post"
                  class="console-action-form"
                >
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                  <label>
                    <span th:text="#{field.reason}">Reason</span>
                    <textarea name="reason" rows="2" minlength="3" maxlength="2000" required
                      th:placeholder="#{field.auditPlaceholder}"></textarea>
                  </label>
                  <button
                    type="submit"
                    class="console-button console-button--primary"
                    th:with="operation=${#messages.msg(change.labelKey())}"
                    th:text="#{action.confirmOperation(${operation})}"
                  >
                    Confirm
                  </button>
                </form>
              </details>
            </td>
          </tr>
        </tbody>
      </table>

      <div th:unless="${universities.isEmpty()}">
        <nav th:replace="~{admin/fragments :: pagination(${universities}, '/admin/universities')}"></nav>
      </div>
    </main>
  </body>
</html>
