<!doctype html>
<html th:lang="${language.tag()}" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{admin/fragments :: head('console.title.reports')}"></head>
  <body class="console-body">
    <aside th:replace="~{admin/fragments :: sidebar}"></aside>
    <main class="console-main">
      <header th:replace="~{admin/fragments :: topbar}"></header>
      <div th:replace="~{admin/fragments :: flash}"></div>

      <form th:action="@{/admin/reports}" method="get" class="console-filters">
        <label>
          <span th:text="#{field.status}">Status</span>
          <select name="status">
            <option value="" th:selected="${#strings.isEmpty(statusFilter)}" th:text="#{filter.allStatuses}">
              All statuses
            </option>
            <option
              th:each="status : ${statuses}"
              th:value="${status.name()}"
              th:text="${#messages.msg(status.labelKey())}"
              th:selected="${status.name() == statusFilter}"
            ></option>
          </select>
        </label>
        <button type="submit" class="console-button console-button--ghost" th:text="#{action.apply}">Apply</button>
      </form>

      <p th:if="${reports.isEmpty()}" class="console-empty" th:text="#{page.reports.empty.filtered}">
        No reports match this filter.
      </p>

      <table th:unless="${reports.isEmpty()}" class="console-table console-table--roomy">
        <thead>
          <tr>
            <th th:text="#{column.submitted}">Submitted</th>
            <th th:text="#{column.target}">Target</th>
            <th th:text="#{column.reason}">Reason</th>
            <th th:text="#{column.status}">Status</th>
            <th th:text="#{column.decision}">Decision</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="report : ${reports.items()}">
            <td>
              <span th:text="${report.submitted()}">date</span>
              <span
                class="console-muted"
                th:with="elapsed=${#messages.msg(report.age().messageKey(), report.age().amount())}"
                th:text="#{page.reports.waiting(${elapsed})}"
                >waiting</span
              >
            </td>
            <td>
              <span class="console-strong" th:text="${report.targetLabel()}">Target</span>
              <span class="console-muted" th:text="${#messages.msg(report.targetType().labelKey())}">Account</span>
              <p class="console-detail" th:if="${report.hasDetails()}" th:text="${report.details()}"></p>
            </td>
            <td th:text="${report.reason()}">SPAM</td>
            <td>
              <span
                class="console-pill"
                th:classappend="'console-pill--' + ${report.statusTone()}"
                th:text="${#messages.msg(report.status().labelKey())}"
                >Open</span
              >
              <p class="console-detail" th:if="${report.hasResolutionNotes()}"
                th:text="${report.resolutionNotes()}"></p>
            </td>
            <td>
              <span th:unless="${report.isActionable()}" class="console-muted" th:text="#{page.reports.closed}"
                >Closed</span
              >
              <details th:if="${report.isActionable()}" class="console-action">
                <summary class="console-button console-button--primary" th:text="#{action.decide}">Decide</summary>
                <form
                  th:action="@{'/admin/reports/' + ${report.id()} + '/decision'}"
                  method="post"
                  class="console-action-form"
                >
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                  <input type="hidden" name="returnStatus" th:value="${statusFilter}" />
                  <label>
                    <span th:text="#{field.decision}">Decision</span>
                    <select name="status" required>
                      <option
                        th:each="decision : ${decisions}"
                        th:value="${decision.name()}"
                        th:text="${#messages.msg(decision.labelKey())}"
                      ></option>
                    </select>
                  </label>
                  <label>
                    <span th:text="#{field.notes}">Notes</span>
                    <textarea name="notes" rows="3" minlength="3" maxlength="2000" required
                      th:placeholder="#{field.auditPlaceholder}"></textarea>
                  </label>
                  <button type="submit" class="console-button console-button--primary" th:text="#{action.saveDecision}">
                    Save decision
                  </button>
                </form>
              </details>
            </td>
          </tr>
        </tbody>
      </table>

      <div th:unless="${reports.isEmpty()}">
        <nav th:replace="~{admin/fragments :: pagination(${reports}, '/admin/reports')}"></nav>
      </div>
    </main>
  </body>
</html>
